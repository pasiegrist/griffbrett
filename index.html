<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#2c2c2a;--muted:#888780;--line:#d3d1c7;--dot:#d85a30;--ok:#3b6d11;--okbg:#eaf3de;--bad:#a32d2d;--badbg:#fcebeb;--okdot:#639922;--wood:transparent;--string:var(--ink);--fret:var(--line);--nut:var(--ink);--inlay:var(--line);--disp:inherit;--bgimg:none;--sheet:transparent;--frame:0px;--cardb:1px solid var(--line);--inv:var(--bg)}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f1d;--card:#2c2c2a;--ink:#f1efe8;--muted:#b4b2a9;--line:#5f5e5a;--okbg:#27500a;--ok:#c0dd97;--badbg:#791f1f;--bad:#f7c1c1;--okdot:#97c459}}
body[data-theme=metal]{--bg:#0d0d0f;--card:#18181b;--ink:#ececee;--muted:#9a9aa3;--line:#3a3a40;--dot:#e01e1e;--ok:#b8f25c;--okbg:#1f2a12;--bad:#ff6b6b;--badbg:#3a0d0d;--okdot:#7fd320;--wood:#17130f;--string:#c9cdd2;--fret:#8b9096;--nut:#e8e4d8;--inlay:#b9bcc2;--disp:"Metal Mania",serif;--bgimg:repeating-linear-gradient(45deg,#0d0d0f 0 6px,#131316 6px 12px);--cardb:1px solid #45454c;--inv:#0d0d0f}
body[data-theme=hendrix]{--bg:#2a0845;--card:#fffaf0;--ink:#3b0a45;--muted:#8a4f7d;--line:#e9b872;--dot:#ff2d95;--ok:#1b6b3a;--okbg:#d8f5c0;--bad:#b00030;--badbg:#ffd0dc;--okdot:#2fbf71;--wood:#6b3a24;--string:#f5c542;--fret:#d9b98a;--nut:#f3e6c8;--inlay:#c77d2e;--disp:"Shrikhand",serif;--bgimg:radial-gradient(circle at 15% 10%,#ff6a00 0,transparent 30%),radial-gradient(circle at 90% 35%,#ff2d95 0,transparent 35%),radial-gradient(circle at 30% 85%,#7b2ff7 0,transparent 40%),repeating-radial-gradient(circle at 50% 45%,#2a0845 0 14px,#4a1170 14px 28px);--sheet:#fff3dc;--frame:12px;--cardb:2px solid #ff8a00;--inv:#fff3dc}
body[data-theme=ska]{--bg:#111;--card:#fff;--ink:#111;--muted:#555;--line:#bdbdbd;--dot:#e10600;--ok:#0a7a2f;--okbg:#d9f7e3;--bad:#c00000;--badbg:#ffe0e0;--okdot:#13a538;--wood:#f2dfb3;--string:#222;--fret:#8a7a5a;--nut:#111;--inlay:#111;--disp:"Bungee",sans-serif;--bgimg:conic-gradient(#111 25%,#f4f4f4 0 50%,#111 0 75%,#f4f4f4 0) 0 0/36px 36px;--sheet:#fff;--frame:12px;--cardb:2px solid #111;--inv:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);background-image:var(--bgimg);background-attachment:fixed;padding:var(--frame);min-height:100vh;color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{background:var(--sheet);border-radius:calc(var(--frame)*1.6);width:100%;max-width:520px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));min-height:calc(100vh - 2*var(--frame));display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:18px;font-weight:600;margin:0;font-family:var(--disp)}
body[data-theme=metal] h1,body[data-theme=hendrix] h1{font-size:24px;font-weight:400}body[data-theme=ska] h1{font-size:19px;font-weight:400}
.themes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.stats{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;color:var(--ink);font-size:15px;padding:8px 0;border-radius:8px}
.seg button.on{background:var(--card);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:13px}
.chip.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:14px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:8px}
.mini{display:flex;align-items:center;gap:4px}.mini span{margin-right:4px}
.mini button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:13px}
.mini button.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--ok)}.sw:checked::after{transform:translateX(16px)}
.card{background:var(--card);border:var(--cardb);border-radius:16px;padding:18px 10px 10px;transition:background .15s}
.card.ok{background:var(--okbg)}.card.bad{background:var(--badbg)}
.target{text-align:center;margin:-4px 0 10px}
.target b{display:block;font-size:52px;line-height:1.1;font-family:var(--disp);font-weight:400}
.target span{font-size:15px;color:var(--muted)}
svg{width:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.fb{min-height:24px;text-align:center;font-size:15px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys.acc button{font-size:14px;padding:14px 0}
.keys button{font-size:24px;font-weight:600;padding:16px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.keys button:active{transform:scale(.96)}
.keys button.right{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.keys button.wrong{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.pbtns{display:flex;gap:10px;justify-content:center}
.foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.foot button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
[hidden]{display:none!important}
.master{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.master input{width:52px;font-size:16px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-align:center}
.btn{font-size:15px;font-weight:600;padding:9px 16px;border-radius:10px;border:none;background:var(--ink);color:var(--inv)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--dot);width:100%}
.mhead{display:none;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
main.running .themes,main.running .seg,main.running .chips,main.running .opts,main.running .master,main.running .foot,main.running .bar,main.running .pbtns{display:none}
main.running .mhead{display:flex}
.result{background:var(--card);border:var(--cardb);border-radius:16px;padding:22px 18px;text-align:center}
.result .score{font-size:56px;font-weight:400;line-height:1.1;font-family:var(--disp)}
.result ul{list-style:none;padding:0;margin:14px 0 0;text-align:left;font-size:14px}
.result li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:18px}
</style>
</head>
<body>
<main>
<header><h1>Griffbrett-Trainer</h1><span class="stats" id="stats"></span></header>
<div class="seg" id="seg"><button data-m="read">Ton erkennen</button><button data-m="find">Ton finden</button></div>
<div class="chips" id="chips"></div>
<div class="opts"><label><input type="checkbox" class="sw" id="optLabels"> Saitennamen</label><label><input type="checkbox" class="sw" id="optAcc"> ♯/♭-Töne</label><label id="shufWrap"><input type="checkbox" class="sw" id="optShuf"> Tasten mischen</label><div class="mini" id="strWrap"><span>Saite</span><button data-s="one">Eine</button><button data-s="all">Alle</button><button data-s="mix">Gemischt</button></div></div>
<div class="master"><label>Master: <input type="number" id="secs" min="1" max="60" step="1" inputmode="numeric"> s pro Aufgabe</label><button class="btn" id="mStart">Start</button></div>
<div class="mhead"><span id="mCount"></span><button class="btn sec" id="mAbort">Abbrechen</button></div>
<div class="tbar" id="tbarW" hidden><i id="tbar"></i></div>
<div class="result" id="result" hidden></div>
<div class="card" id="card"><div class="target" id="target" hidden></div><svg id="neck" viewBox="0 0 340 160"></svg></div>
<div class="fb" id="fb"></div>
<div class="keys" id="keys"></div>
<div class="pbtns" id="pbtns" hidden><button class="btn sec" id="pShow">Zeigen</button><button class="btn sec" id="pSkip">Überspringen</button></div>
<div class="bar"><i id="bar"></i></div>
<div class="foot"><span id="learned"></span><button id="reset">Fortschritt zurücksetzen</button></div>
<div class="themes" id="themes"><span>Stil</span></div>
</main>
<script>
const CH=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLAT={"C#":"D♭","D#":"E♭","F#":"G♭","G#":"A♭","A#":"B♭"};
const disp=n=>n.includes("#")?n.replace("#","♯")+"/"+FLAT[n]:n;
const NF=15;
const STR=[{l:"E",n:"tiefe E-Saite",d:"tiefen E-Saite",y:5,m:40},{l:"A",n:"A-Saite",d:"A-Saite",y:4,m:45},{l:"D",n:"D-Saite",d:"D-Saite",y:3,m:50},{l:"G",n:"G-Saite",d:"G-Saite",y:2,m:55},{l:"B",n:"B-Saite",d:"B-Saite",y:1,m:59},{l:"e",n:"hohe e-Saite",d:"hohen e-Saite",y:0,m:64}];
const noteAt=(si,f)=>CH[(STR[si].m+f)%12];
const ALL=[];
STR.forEach((s,si)=>{for(let f=0;f<=NF;f++){const n=noteAt(si,f);ALL.push({id:si+"-"+f,si,f,note:n,acc:n.includes("#")})}});
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let box=store.get("fbt-box2",null);if(!box||!box.read)box={read:store.get("fbt-box",{})};if(!box.find)box.find={};
let mode=store.get("fbt-mode","read");if(mode!=="find")mode="read";
let active=store.get("fbt-strings",[0,1,2,3,4,5]);
let useShuf=store.get("fbt-shuf",false),showLabels=store.get("fbt-labels",true),useAcc=store.get("fbt-acc",false);
let findSub=store.get("fbt-findsub",store.get("fbt-withstr",true)?"one":"all");if(!["one","all","mix"].includes(findSub))findSub="one";
let cur=null,last=null,locked=false,errors=0,revealed=false,found=new Set(),flash=null,session={ok:0,n:0},M=null;
const $=id=>document.getElementById(id);
const saveBox=()=>store.set("fbt-box2",box);
const L=40,R=334,T=20,G=22,FW=(R-L)/NF;
const dotX=f=>f===0?L-10:L+(f-.5)*FW,dotY=si=>T+STR[si].y*G;

function allowed(){return mode==="find"&&cur&&cur.si!=null?[cur.si]:active}
function drawNeck(dots,hi){
  const al=allowed();
  let s=`<rect x="${L}" y="${T-9}" width="${R-L}" height="${5*G+18}" rx="2" fill="var(--wood)"/>`;
  if(showLabels)["e","B","G","D","A","E"].forEach((l,i)=>s+=`<text x="12" y="${T+i*G+4}" font-size="12" text-anchor="middle" fill="var(--muted)"${al.includes(5-i)?"":` opacity="0.35"`}>${l}</text>`);
  for(let k=1;k<=NF;k++)s+=`<line x1="${L+k*FW}" y1="${T}" x2="${L+k*FW}" y2="${T+5*G}" stroke="var(--fret)" stroke-width="1.2"/>`;
  s+=`<line x1="${L}" y1="${T-9}" x2="${L}" y2="${T+5*G+9}" stroke="var(--nut)" stroke-width="4"/>`;
  for(let i=0;i<6;i++){const isHi=hi!=null&&STR[hi].y===i,si=STR.findIndex(x=>x.y===i),on=al.includes(si);s+=`<line x1="${L}" y1="${T+i*G}" x2="${R}" y2="${T+i*G}" stroke="${isHi?"var(--dot)":"var(--string)"}" stroke-width="${isHi?3.5:0.7+i*0.3}"${on?"":` stroke-opacity="0.22"`}/>`}
  const iy=T+5*G+16;[3,5,7,9,15].forEach(k=>s+=`<circle cx="${L+(k-.5)*FW}" cy="${iy}" r="3.2" fill="var(--inlay)"/>`);
  [-4.5,4.5].forEach(d=>s+=`<circle cx="${L+11.5*FW+d}" cy="${iy}" r="3.2" fill="var(--inlay)"/>`);
  (dots||[]).forEach(c=>{const x=dotX(c.f),y=dotY(c.si),k=c.k||"main";
    if(k==="main")s+=`<circle cx="${x}" cy="${y}" r="8" fill="var(--dot)"/>`;
    else if(k==="found")s+=`<circle cx="${x}" cy="${y}" r="8" fill="var(--okdot)"/>`;
    else if(k==="hint")s+=`<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="var(--dot)" stroke-width="2" stroke-dasharray="3 2"/>`;
    else if(k==="wrong")s+=`<g stroke="var(--bad)" stroke-width="2.5" stroke-linecap="round"><line x1="${x-6}" y1="${y-6}" x2="${x+6}" y2="${y+6}"/><line x1="${x+6}" y1="${y-6}" x2="${x-6}" y2="${y+6}"/></g>`;
  });
  $("neck").innerHTML=s;
}
function setFb(t,cls){$("fb").textContent=t;$("fb").className="fb"+(cls?" "+cls:"")}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* Aufgaben */
function findPositions(note,si){
  const out=[];(si!=null?[si]:active).forEach(s=>{for(let f=0;f<=NF;f++)if(noteAt(s,f)===note)out.push({si:s,f})});return out;
}
function pool(){
  if(mode==="read")return ALL.filter(c=>active.includes(c.si)&&(useAcc||!c.acc));
  const notes=CH.filter(n=>useAcc||!n.includes("#"));
  const one=[];active.forEach(si=>notes.forEach(n=>one.push({id:"s"+si+"-"+n,si,note:n})));
  const all=active.length?notes.map(n=>({id:"n-"+n,si:null,note:n})):[];
  return findSub==="one"?one:findSub==="all"?all:one.concat(all);
}
function prepare(c){if(mode==="find")c.pos=findPositions(c.note,c.si);return c}
function desc(c){
  if(mode==="read")return c.f===0?"leere "+STR[c.si].n:STR[c.si].n+" · "+c.f+". Bund";
  return disp(c.note)+(c.si!=null?" auf der "+STR[c.si].d:" überall");
}
const key=p=>p.si+"-"+p.f;
function findDots(extraHint){
  const d=cur.pos.filter(p=>found.has(key(p))).map(p=>({...p,k:"found"}));
  if(revealed||extraHint)cur.pos.filter(p=>!found.has(key(p))).forEach(p=>d.push({...p,k:"hint"}));
  if(flash)d.push({...flash,k:"wrong"});
  return d;
}
function progressTxt(){return cur.pos.length>1?`${found.size} von ${cur.pos.length} gefunden`:"Tippe die Stelle an."}
function render(){
  $("card").className="card";
  if(mode==="read"){
    $("target").hidden=true;drawNeck([cur],null);setFb("Welcher Ton ist das?");
    document.querySelectorAll(".keys button").forEach(b=>b.className="");
  }else{
    $("target").hidden=false;
    $("target").innerHTML=`<b>${disp(cur.note)}</b><span>${cur.si!=null?"auf der "+STR[cur.si].d:"alle Stellen bis zum "+NF+". Bund"}</span>`;
    drawNeck(findDots(),cur.si);setFb(progressTxt());
  }
}
function newTarget(){locked=false;errors=0;revealed=false;found=new Set();flash=null}
function pick(){
  const p=pool();if(!p.length){cur=null;$("target").hidden=true;drawNeck([],null);setFb("Wähle mindestens eine Saite.");return}
  const bx=box[mode];
  const w=p.map(c=>{const b=bx[c.id]||0;return c.id===last&&p.length>1?0:[8,4,2,1,.5][Math.min(b,4)]});
  let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(i<p.length-1&&r>=w[i]){r-=w[i];i++}
  cur=prepare({...p[i]});last=cur.id;newTarget();
  if(mode==="read"&&useShuf)buildKeys();
  render();
}

/* Ton erkennen */
function answer(n,btn){
  if(mode!=="read"||!cur||locked)return;locked=true;
  const ok=n===cur.note,pos=desc(cur);
  if(ok){box.read[cur.id]=(box.read[cur.id]||0)+1;btn.className="right";$("card").className="card ok";setFb("Richtig: "+disp(cur.note)+" ("+pos+")","ok")}
  else{box.read[cur.id]=0;btn.className="wrong";const k=document.querySelector(`[data-n="${cur.note}"]`);if(k)k.className="right";$("card").className="card bad";setFb("Das ist "+disp(cur.note)+" ("+pos+")","bad")}
  saveBox();
  if(M){clearInterval(M.timer);M.res.push({c:cur,ok,t:(performance.now()-M.t0)/1000});setTimeout(nextMaster,ok?500:1500);return}
  session.n++;if(ok)session.ok++;upd();setTimeout(pick,ok?700:1800);
}

/* Ton finden */
function hitTest(ev){
  const r=$("neck").getBoundingClientRect();if(!r.width)return null;
  const x=(ev.clientX-r.left)/r.width*340,y=(ev.clientY-r.top)/r.height*160;
  let best=null,bd=1e9;
  for(const si of allowed()){const d=Math.abs(y-dotY(si));if(d<bd){bd=d;best=si}}
  if(best==null||bd>G*0.9)return null;
  if(x<L-22||x>R+6)return null;
  const f=x<L+3?0:Math.min(NF,Math.max(1,Math.ceil((x-L)/FW)));
  return {si:best,f};
}
function tap(ev){
  if(mode!=="find"||!cur||locked)return;
  const h=hitTest(ev);if(!h)return;
  if(found.has(key(h)))return;
  if(cur.pos.some(p=>key(p)===key(h))){
    found.add(key(h));flash=null;
    if(found.size===cur.pos.length)return solved();
    drawNeck(findDots(),cur.si);setFb(progressTxt());
  }else{
    errors++;flash=h;
    if(!M){box.find[cur.id]=0;saveBox()}
    drawNeck(findDots(),cur.si);
    setFb("Das ist "+disp(noteAt(h.si,h.f))+(cur.si!=null&&h.si!==cur.si?" (falsche Saite)":"")+". "+progressTxt(),"bad");
    $("card").className="card bad";
    const me=flash;setTimeout(()=>{if(flash===me){flash=null;if(!locked){$("card").className="card";drawNeck(findDots(),cur.si)}}},700);
  }
}
function solved(){
  locked=true;flash=null;drawNeck(findDots(),cur.si);$("card").className="card ok";
  const clean=!errors&&!revealed;
  setFb((cur.pos.length>1?"Alle gefunden":"Richtig")+(errors?" · "+errors+" Fehltipp"+(errors>1?"s":""):""),"ok");
  if(M){clearInterval(M.timer);M.res.push({c:cur,ok:true,t:(performance.now()-M.t0)/1000,errors});setTimeout(nextMaster,700);return}
  session.n++;if(clean){session.ok++;box.find[cur.id]=(box.find[cur.id]||0)+1}else box.find[cur.id]=0;
  saveBox();upd();setTimeout(pick,1300);
}

function upd(){
  const p=pool(),bx=box[mode],l=p.filter(c=>(bx[c.id]||0)>=3).length;
  $("stats").textContent=session.n?`${session.ok}/${session.n} richtig`:"";
  $("learned").textContent=`Sicher: ${l} von ${p.length}`;
  $("bar").style.width=(p.length?l/p.length*100:0)+"%";
}
function chips(){
  $("chips").innerHTML="";
  STR.forEach((s,i)=>{const b=document.createElement("button");b.className="chip"+(active.includes(i)?" on":"");b.textContent=s.l+"-Saite";
  b.onclick=()=>{active=active.includes(i)?active.filter(x=>x!==i):[...active,i].sort();store.set("fbt-strings",active);chips();upd();pick()};$("chips").appendChild(b)});
}
function buildKeys(){$("keys").innerHTML="";$("keys").className=useAcc?"keys acc":"keys";
  let list=(useAcc?CH:["C","D","E","F","G","A","B"]).slice();if(useShuf)list=shuf(list);
  list.forEach(n=>{const b=document.createElement("button");b.textContent=disp(n);b.dataset.n=n;b.onclick=()=>answer(n,b);$("keys").appendChild(b)})}
function updModeUI(){
  document.querySelectorAll("#seg button").forEach(b=>b.className=b.dataset.m===mode?"on":"");
  const find=mode==="find",done=!!(M&&M.done);
  $("keys").hidden=find||done;$("pbtns").hidden=!find||done;$("shufWrap").hidden=find;$("strWrap").hidden=!find;
}
function setMode(m){
  if(M)exitMaster(true);
  mode=m;store.set("fbt-mode",m);session={ok:0,n:0};last=null;
  updModeUI();upd();pick();
}

/* Master-Modus */
function startMaster(){
  const s=Math.max(1,Math.min(60,Math.round(+$("secs").value||5)));$("secs").value=s;store.set("fbt-secs-"+mode,s);
  const p=pool();if(!p.length)return;
  let q=shuf(p);while(q.length<10)q=q.concat(shuf(p));
  M={q:q.slice(0,10),i:-1,res:[],secs:s,timer:null,done:false};
  document.querySelector("main").classList.add("running");
  $("result").hidden=true;$("card").hidden=false;$("fb").hidden=false;$("tbarW").hidden=false;updModeUI();
  nextMaster();
}
function nextMaster(){
  if(!M)return;M.i++;if(M.i>=10)return endMaster();
  cur=prepare({...M.q[M.i]});newTarget();
  if(mode==="read"&&useShuf)buildKeys();
  render();$("mCount").textContent=`Aufgabe ${M.i+1} von 10`;
  M.t0=performance.now();$("tbar").style.width="100%";clearInterval(M.timer);
  M.timer=setInterval(()=>{const el=(performance.now()-M.t0)/1000;$("tbar").style.width=Math.max(0,100-el/M.secs*100)+"%";if(el>=M.secs){clearInterval(M.timer);timeUp()}},50);
}
function timeUp(){
  if(!M||locked)return;locked=true;box[mode][cur.id]=0;saveBox();
  if(mode==="read"){const k=document.querySelector(`[data-n="${cur.note}"]`);if(k)k.className="right";setFb("Zeit abgelaufen: "+disp(cur.note)+" ("+desc(cur)+")","bad")}
  else{flash=null;drawNeck(findDots(true),cur.si);setFb("Zeit abgelaufen: "+found.size+" von "+cur.pos.length+" gefunden","bad")}
  $("card").className="card bad";
  M.res.push({c:cur,ok:false,t:M.secs,to:true,got:mode==="find"?found.size:0});setTimeout(nextMaster,mode==="find"?2200:1500);
}
function endMaster(){
  clearInterval(M.timer);M.done=true;
  const r=M.res,n=r.filter(x=>x.ok).length,okT=r.filter(x=>x.ok).map(x=>x.t);
  const avg=okT.length?okT.reduce((a,b)=>a+b,0)/okT.length:null;
  const errs=r.reduce((a,x)=>a+(x.errors||0),0);
  const bkey="fbt-best-"+(mode==="find"?"find-"+findSub+"-":"")+M.secs+"-"+(useAcc?1:0),best=store.get(bkey,null);
  const rec=n>0&&(!best||n>best.n||(n===best.n&&avg<best.avg));
  if(rec)store.set(bkey,{n,avg});
  const miss=r.filter(x=>!x.ok);
  $("card").hidden=true;$("keys").hidden=true;$("pbtns").hidden=true;$("fb").hidden=true;$("tbarW").hidden=true;$("mCount").textContent="Abrechnung";
  const line=x=>mode==="find"?`<li><span>${desc(x.c)}</span><span>${x.got} von ${x.c.pos.length} · Zeit</span></li>`:`<li><span>${desc(x.c)}</span><span>${disp(x.c.note)}${x.to?" · Zeit":""}</span></li>`;
  $("result").innerHTML=`<div class="score">${n}/10</div>
  <div style="color:var(--muted);margin-top:8px">${mode==="find"?"Ton finden"+{one:" auf einer Saite",all:" überall",mix:" gemischt"}[findSub]+" · ":""}${avg!==null?"Ø "+avg.toFixed(1)+" s · ":""}${M.secs} s pro Aufgabe${useAcc?" · mit ♯/♭":""}${mode==="find"?" · "+errs+" Fehltipp"+(errs===1?"":"s"):""}</div>
  <div style="margin-top:8px;font-size:14px;color:${rec?"var(--ok)":"var(--muted)"}">${rec?"Neuer Rekord":best?"Rekord: "+best.n+"/10"+(best.avg!=null?", Ø "+best.avg.toFixed(1)+" s":""):""}</div>
  ${miss.length?"<ul>"+miss.map(line).join("")+"</ul>":`<div style="margin-top:14px">Alles richtig.</div>`}
  <div class="rbtns"><button class="btn" id="rAgain">Nochmal</button><button class="btn sec" id="rBack">Zurück zum Üben</button></div>`;
  $("result").hidden=false;
  $("rAgain").onclick=startMaster;$("rBack").onclick=()=>exitMaster();
}
function exitMaster(silent){
  if(M)clearInterval(M.timer);M=null;
  document.querySelector("main").classList.remove("running");
  $("result").hidden=true;$("tbarW").hidden=true;$("card").hidden=false;$("fb").hidden=false;
  updModeUI();loadSecs();if(!silent){buildKeys();upd();pick()}
}
function loadSecs(){$("secs").value=store.get("fbt-secs-"+mode,store.get("fbt-secs",mode==="find"?{one:5,all:20,mix:15}[findSub]:5))}

/* Verdrahtung */
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{if(b.dataset.m!==mode){setMode(b.dataset.m);loadSecs()}});
$("neck").addEventListener("pointerdown",tap);
$("optShuf").checked=useShuf;$("optShuf").onchange=e=>{useShuf=e.target.checked;store.set("fbt-shuf",useShuf);buildKeys()};
function updSub(){document.querySelectorAll("#strWrap button").forEach(b=>b.className=b.dataset.s===findSub?"on":"")}
document.querySelectorAll("#strWrap button").forEach(b=>b.onclick=()=>{if(b.dataset.s===findSub)return;findSub=b.dataset.s;store.set("fbt-findsub",findSub);updSub();last=null;loadSecs();upd();pick()});
updSub();
$("optLabels").checked=showLabels;$("optAcc").checked=useAcc;
$("optLabels").onchange=e=>{showLabels=e.target.checked;store.set("fbt-labels",showLabels);if(!cur)return;if(mode==="read")drawNeck([cur],null);else drawNeck(findDots(),cur.si)};
$("optAcc").onchange=e=>{useAcc=e.target.checked;store.set("fbt-acc",useAcc);buildKeys();upd();pick()};
$("pShow").onclick=()=>{if(!cur||locked||mode!=="find")return;revealed=true;box.find[cur.id]=0;saveBox();drawNeck(findDots(),cur.si);setFb("Gestrichelt: hier fehlt noch etwas. Tippe die Stellen an.")};
$("pSkip").onclick=()=>{if(!locked)pick()};
let armed=false;$("reset").onclick=()=>{if(!armed){armed=true;$("reset").textContent="Nochmal tippen zum Bestätigen";setTimeout(()=>{armed=false;$("reset").textContent="Fortschritt zurücksetzen"},3000);return}
  armed=false;$("reset").textContent="Fortschritt zurücksetzen";box[mode]={};saveBox();session={ok:0,n:0};upd()};
$("mStart").onclick=startMaster;$("mAbort").onclick=()=>exitMaster();
const THEMES=[["neutral","Neutral"],["metal","Metal"],["hendrix","Hendrix"],["ska","Ska"]];
const THEME_BG={metal:"#0d0d0f",hendrix:"#2a0845",ska:"#111111"};
let theme=store.get("fbt-theme","neutral");
function applyTheme(){
  if(theme==="neutral")delete document.body.dataset.theme;else document.body.dataset.theme=theme;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{if(!m.dataset.orig)m.dataset.orig=m.content;m.content=THEME_BG[theme]||m.dataset.orig});
  document.querySelectorAll("#themes .chip").forEach(b=>b.className="chip"+(b.dataset.t===theme?" on":""));
}
THEMES.forEach(([t,n])=>{const b=document.createElement("button");b.className="chip";b.dataset.t=t;b.textContent=n;b.onclick=()=>{theme=t;store.set("fbt-theme",t);applyTheme()};$("themes").appendChild(b)});
applyTheme();
loadSecs();buildKeys();chips();updModeUI();upd();pick();
</script>
</body>
</html>
